name: Generate and stage RVU Kids 244 review audio files
on:
  push:
    branches:
      - feature/audio-review-drafts-244
    paths:
      - .github/workflows/audio-drafts.yml
      - scripts/generate-audio-review.mjs
      - audio-review/index.html
      - build.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feature/audio-review-drafts-244
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install US-English speech synthesis and codec tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg
      - name: Generate all draft recordings
        run: node scripts/generate-audio-review.mjs
      - name: Check exactly 244 MP3 files and valid draft manifest
        run: |
          python3 - <<'PY'
          import pathlib, json
          root=pathlib.Path('audio-review')
          m=json.loads((root/'learn/audio-manifest.json').read_text())
          files=list((root/'learn/audio').rglob('*.mp3'))
          assert len(files)==244, len(files)
          assert len(m['recordings'])==244
          assert m['notForPublicPlayback'] is True
          assert all((root/r['asset'].lstrip('/')).is_file() for r in m['recordings'])
          assert all(r['review_status']=='pending-human-review' for r in m['recordings'])
          print('244/244 audio review files present, child-facing playback remains off')
          PY
      - name: Commit MP3 files into review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f audio-review/learn/audio audio-review/learn/audio-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Stage 244 synthetic recordings for owner listening review"
            git push origin HEAD:feature/audio-review-drafts-244
          fi
      - name: Upload a short-lived backup review artifact
        uses: actions/upload-artifact@v4
        with:
          name: rvu-kids-audio-review-244
          path: audio-review/
          if-no-files-found: error
          retention-days: 14
