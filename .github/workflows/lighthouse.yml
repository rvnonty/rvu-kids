name: Performance and accessibility (manual)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lighthouse.yml
      - learn/learn.css
      - learn/next-adventures.css
      - learn/story-journey.css
      - assets/cover.webp
      - home-motion.css
      - home-motion.mjs
      - style.css
      - index.html
      - build.mjs
      - learn/next-adventures.mjs
      - learn/learn.js
      - learn/storybook.mjs
      - learn/index.html
      - learn/alphabet/index.html
      - preview/index.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static site
        run: npm run build
      - name: Start local site
        run: |
          npx --yes http-server@14.1.1 dist -p 4173 -c-1 --silent > /tmp/rvu-web.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rvu-web.log
          exit 1
      - name: Prepare report folder
        run: mkdir -p reports
      - name: Run Lighthouse - home
        run: npx --yes lighthouse@12.6.0 http://127.0.0.1:4173/ --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility --output=json --output-path=reports/home.json --quiet
      - name: Run Lighthouse - alphabet
        run: npx --yes lighthouse@12.6.0 http://127.0.0.1:4173/learn/alphabet/ --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility --output=json --output-path=reports/alphabet.json --quiet
      - name: Run Lighthouse - preview
        run: npx --yes lighthouse@12.6.0 http://127.0.0.1:4173/preview/ --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility --output=json --output-path=reports/preview.json --quiet
      - name: Check LCP and CLS budgets
        run: node scripts/check-vitals.mjs reports/home.json reports/alphabet.json reports/preview.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rvu-lighthouse-reports
          path: reports/*.json
          if-no-files-found: warn
