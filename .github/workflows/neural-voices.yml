name: Create female and male American neural audio previews

on:
  push:
    branches: [feature/natural-us-dual-voices]
    paths:
      - .github/workflows/neural-voices.yml
      - scripts/generate-natural-voices.py
      - audio-review/index.html
      - tests/neural-voices.test.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rvu-neural-voices-production
  cancel-in-progress: false

jobs:
  synthesize-and-stage:
    name: Generate and verify 488 US-English clips
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/natural-us-dual-voices
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install audio and phonemizer utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libsndfile1
      - name: Install CPU neural speech engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "kokoro==0.9.4" "soundfile>=0.12,<1" "numpy>=1.24,<3" "transformers>=4.49,<5"
      - name: Generate male and female voice previews
        run: python -u scripts/generate-natural-voices.py
      - name: Stage generated files on review-only branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f audio-review/neural/ audio-review/neural-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Stage 488 US-English neural preview clips (two voices, unapproved)"
            git push origin HEAD:feature/natural-us-dual-voices
          fi
      - name: Validate generated clips and all existing site tests
        run: |
          npm run build
          node --check app.js
          node --test tests/*.test.mjs
      - name: Preserve review build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: RVU-244-recordings-two-natural-American-voices-review
          path: |
            audio-review/neural/
            audio-review/neural-manifest.json
            audio-review/index.html
          if-no-files-found: error
          retention-days: 14
