name: Import user-approved chameleon and original standalone picture stickers
on:
  push:
    branches: [feat/approved-chameleon-original-illustrations-20261114]
    paths: [.github/workflows/import-approved-artwork.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Fetch user-provided transparent chameleon and custom painted educational objects
        env:
          CHAMELEON_SOURCE: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/ab47b3d6-e6d2-497b-8157-d25b955f09d1.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjMxMTQ5Y2UzMzc5YjQ0OSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDc4Nzc5MH0.N4pPjeXVAt8aEPASRbZ8gA9kyBeqbnfXT23miXmHdXU"
          PAINTINGS_SOURCE: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/543ecc4e-109b-4bf6-95c6-8ac8d2a3a409.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDhhNTZlNWFkNjY4OGQ5MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDc4MTAxOH0.OeMe545MKwWV-b4-x_UYRoclQHBjdPnmExNu1adCWCY"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$CHAMELEON_SOURCE" -o /tmp/rvu-chameleon.png
          curl --fail --location --retry 3 --silent --show-error "$PAINTINGS_SOURCE" -o /tmp/rvu-painted-words.png
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          import json
          out=Path('assets/mascot');out.mkdir(parents=True,exist_ok=True)
          im=Image.open('/tmp/rvu-chameleon.png').convert('RGBA')
          assert im.size[0]>=800 and im.size[1]>=800
          im.thumbnail((480,430),Image.Resampling.LANCZOS)
          im.save(out/'chameleon.webp','WEBP',quality=88,method=6)
          assert (out/'chameleon.webp').stat().st_size<170000
          source=Image.open('/tmp/rvu-painted-words.png').convert('RGBA')
          assert source.width>=1100 and source.height>=1100
          words=['apple','ant','airplane','alligator','ball',
                 'bear','banana','boat','cat','car',
                 'cake','carrot','door','dog','duck',
                 'drum','egg','elephant','envelope','fish',
                 'flower','frog','fox','goat','grapes']
          root=Path('assets/stickers')
          manifest=root/'manifest.json'
          data=json.loads(manifest.read_text())
          assert len(data['items'])==101
          for n,word in enumerate(words):
            row,col=divmod(n,5)
            # Equally sized image cells; preserve the artist's transparent edges.
            x0=round(col*source.width/5);x1=round((col+1)*source.width/5)
            y0=round(row*source.height/5);y1=round((row+1)*source.height/5)
            cut=source.crop((x0,y0,x1,y1))
            # Avoid bleeding adjacent artwork into neighbouring cells.
            inset=5
            cut=cut.crop((inset,inset,cut.width-inset,cut.height-inset))
            bbox=cut.getchannel('A').getbbox()
            if not bbox: raise RuntimeError('Empty original illustration: '+word)
            cut=cut.crop(bbox)
            cut.thumbnail((188,188),Image.Resampling.LANCZOS)
            canvas=Image.new('RGBA',(208,208),(0,0,0,0))
            canvas.alpha_composite(cut,((208-cut.width)//2,(208-cut.height)//2))
            dest=root/(word+'.webp')
            canvas.save(dest,'WEBP',quality=90,method=6)
            parsed=Image.open(dest)
            assert parsed.mode=='RGBA' and parsed.size==(208,208) and 1000<dest.stat().st_size<150000,word
            for item in data['items']:
              if item['word']==word:
                item.update({'bytes':dest.stat().st_size,'artwork':'RVU custom illustrated object, transparent, new standalone illustration'})
                break
            else:raise RuntimeError('Vocabulary mapping missing: '+word)
          data['source']='RVU original painted illustrations and transparent independent vocabulary images; existing 76 items retained pending individualized illustration approval'
          manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('Verified approved turquoise chameleon:',(out/'chameleon.webp').stat().st_size,'bytes')
          print('Verified',len(words),'original standalone objects, and',len(data['items']),'total vocabulary mappings')
          PY
      - name: Commit validated visual assets only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mascot/chameleon.webp assets/stickers/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add exact supplied mascot and 25 original painted transparent vocabulary illustrations"
          git push origin HEAD:feat/approved-chameleon-original-illustrations-20261114
