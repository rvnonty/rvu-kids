name: Rebuild RVU Kids five book previews

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-book-previews.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Remove white paper gutters and resize all five pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          root=Path("assets")
          pages={
              "cover.webp":0,
              "letter-a.webp":22,
              "practice-a.webp":22,
              "feelings.webp":0,
              "letter-m.webp":6,
          }
          for name,margin in pages.items():
              path=root/name
              with Image.open(path) as src:
                  im=src.convert("RGB")
                  old=im.size
                  if margin:
                      assert im.width > 2*margin + 100
                      im=im.crop((margin,0,im.width-margin,im.height))
                  width=1200
                  height=round(im.height*width/im.width)
                  im=im.resize((width,height),Image.Resampling.LANCZOS)
                  im=im.filter(ImageFilter.UnsharpMask(radius=1.1,percent=95,threshold=3))
                  im.save(path,"WEBP",quality=92,method=6)
              with Image.open(path) as check:
                  check.load()
                  assert check.width==1200
                  print(f"{name}: {old} => {check.size}, {path.stat().st_size:,} bytes")
          PY
      - name: Save optimized five-page preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cover.webp assets/letter-a.webp assets/practice-a.webp assets/feelings.webp assets/letter-m.webp
          if ! git diff --staged --quiet; then
            git commit -m "Rebuild five borderless preview images at 1200px"
            git push
          fi
