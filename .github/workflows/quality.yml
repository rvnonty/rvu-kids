name: RVU Kids Quality Checks

on:
  push:
    branches: [main, feature/letter-name-mascot-interactions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check app.js
          node --check learn/content.js
          node --check learn/learn.js
          node --check learn/activities.mjs
          node --check learn/activity-data.mjs
      - name: Build all site sections
        run: npm run build
      - name: Verify book curriculum, routes and previews
        run: npm test
      - name: Validate CDN static assets and local functional smoke
        run: |
          node scripts/static-check.mjs
          node scripts/smoke-static.mjs
