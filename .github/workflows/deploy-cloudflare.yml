name: Deploy RVU Kids to Cloudflare staging
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rvu-kids-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate staging bundle
        run: |
          npm run build
          npm test
          node scripts/static-check.mjs
          node scripts/smoke-static.mjs
      - name: Verify Cloudflare credentials before deploying
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing required GitHub Actions secrets. Nothing was deployed."
            exit 1
          fi
      - name: Deploy static-only Cloudflare Worker without domain cutover
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.static.jsonc
