name: Five-pass final production regression
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/five-pass-final.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repeat complete production test suite five times
        run: |
          for pass in 1 2 3 4 5; do
            echo "::group::FULL REVIEW PASS $pass/5"
            npm test
            node scripts/static-check.mjs
            node scripts/smoke-static.mjs
            echo "::endgroup::"
          done
      - name: Verify the production page and cache artifacts
        run: |
          test -s dist/index.html
          test -s dist/learn/index.html
          test -s dist/learn/media-sw.js
          test -s dist/preview/index.html
          test -s dist/learn/audio-manifest.json
          echo "All five complete validation passes succeeded."
