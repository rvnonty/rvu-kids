name: Install RVU original 3D kids welcome video
on:
  push:
    branches: [feat/welcome-loop-book-chameleon-20261114]
    paths:
      - .github/workflows/install-kids-welcome-loop.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-asset:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Prepare the user-supplied welcoming kids animation as a seamlessly looping lightweight MP4
        env:
          RVU_SOURCE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/07cef63e-bfde-4ee9-b6db-3869f95e7476.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjJiMDJjYWQ2YjFhMzk3OCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDgxOTI0NX0.nz3UQO3jd4j_-xu-BGmhmyYlXU0dkWWxJaPsOZvvf-M'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 90 --silent --show-error "$RVU_SOURCE_URL" --output /tmp/rvu-kids-original.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of json /tmp/rvu-kids-original.mp4
          test "$(stat -c %s /tmp/rvu-kids-original.mp4)" -gt 100000
          mkdir -p assets
          ffmpeg -nostdin -y -hide_banner -loglevel error -i /tmp/rvu-kids-original.mp4 \
            -filter_complex "[0:v]scale=540:960:flags=lanczos,format=yuv420p,split=2[v0][v1];[v0]trim=start=0.75:end=10,setpts=PTS-STARTPTS,fps=24,settb=AVTB[main];[v1]trim=start=0:end=0.75,setpts=PTS-STARTPTS,fps=24,settb=AVTB[head];[main][head]xfade=transition=fade:duration=0.75:offset=8.5,format=yuv420p[video]" \
            -map "[video]" -an -c:v libx264 -preset medium -crf 29 -movflags +faststart -pix_fmt yuv420p -r 24 \
            assets/rvu-hero-loop.mp4
          python3 - <<'PY'
          import json,subprocess,pathlib
          f=pathlib.Path('assets/rvu-hero-loop.mp4')
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-show_entries','stream=width,height,codec_name','-of','json',str(f)]))
          assert 9<=float(meta['format']['duration'])<=9.5,meta
          assert meta['streams'][0]['width']==540 and meta['streams'][0]['height']==960
          assert meta['streams'][0]['codec_name']=='h264'
          assert 90000<f.stat().st_size<1200000
          print('Verified intro loop:',f.stat().st_size,'bytes',meta)
          PY
      - name: Publish validated animation to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rvu-hero-loop.mp4
          if git diff --cached --quiet; then
            echo "Intro video already installed"
            exit 0
          fi
          git commit -m "Install original welcoming kids loop as optimized local MP4"
          git push origin HEAD:feat/welcome-loop-book-chameleon-20261114
